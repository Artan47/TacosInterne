}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--maiz);outline-offset:2px}
img{max-width:100%}

/* Layout */
.app{display:flex;min-height:100%}
.side{display:none}
main{flex:1;min-width:0;max-width:880px;margin:0 auto;padding:20px 16px 110px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem}
.brand .disc{width:26px;height:26px;border-radius:50%;background:var(--maiz);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--maiz) 70%,#7a4d00);position:relative}
.brand .disc::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2px dotted color-mix(in srgb,#7a4d00 55%,transparent)}
.brand .logo{width:46px;height:46px;border-radius:12px;display:block;background:#1B1A1A}
.side .brand .logo{width:140px;height:140px;border-radius:20px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.who-chip{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer}
.who-chip .av{width:24px;height:24px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.75rem}

.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.bottom button,.side button{background:none;border:0;cursor:pointer;color:var(--muted)}
.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;padding:6px 8px;border-radius:10px;min-width:58px}
.bottom button[aria-current="page"]{color:var(--verde);font-weight:700}
.bottom svg,.side svg{width:22px;height:22px}

@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;width:232px;flex-shrink:0;padding:24px 14px;border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
  .side .brand{margin:0 8px 22px}
  .side button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:.95rem;text-align:left}
  .side button:hover{background:var(--bg);color:var(--ink)}
  .side button[aria-current="page"]{background:var(--verde-soft);color:var(--verde);font-weight:700}
  .side .sep{height:1px;background:var(--line);margin:10px 8px}
  .bottom{display:none}
  main{padding:32px 32px 60px}
  .topbar .brand{display:none}
}

/* Blocks */
.section{margin-top:28px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpis>div{background:var(--surface);padding:14px 16px}
.kpis .v{font-family:var(--display);font-size:1.3rem;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis .l{font-size:.8rem;color:var(--muted)}
@media (min-width:640px){.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pos{color:var(--verde)} .neg{color:var(--chile)}

.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list>li{border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.85rem;color:var(--muted)}
.row .r{text-align:right;white-space:nowrap}
.group-label{font-size:.85rem;color:var(--muted);margin:18px 2px 6px;font-weight:700}

.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--verde-soft);color:var(--verde)}
.pill.warn{background:var(--maiz-soft);color:color-mix(in srgb,var(--maiz) 70%,var(--ink))}
.pill.bad{background:var(--chile-soft);color:var(--chile)}
.pill.neutral{background:var(--bg);color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;min-height:44px}
.btn.primary{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.ink{background:var(--ink-btn);border-color:var(--ink-btn);color:var(--on-ink)}
.btn.danger{color:var(--chile);border-color:color-mix(in srgb,var(--chile) 40%,var(--line))}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink-btn);color:var(--on-ink);border-color:var(--ink-btn)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
@media (min-width:900px){.fab{bottom:28px;right:32px}}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}
.banner{border-radius:12px;padding:12px 14px;font-size:.9rem;margin-bottom:14px}
.banner.info{background:var(--maiz-soft)}
.banner.err{background:var(--chile-soft);color:var(--chile)}

/* Tasks */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:12px 0 14px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 6px;text-align:center;cursor:pointer;position:relative}
.day .dn{font-size:.72rem;color:var(--muted)}
.day .dd{font-family:var(--display);font-weight:600;font-size:1.1rem}
.day .dots{height:6px;display:flex;justify-content:center;gap:3px;margin-top:2px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--maiz)}
.day.today .dd{color:var(--verde)}
.day[aria-pressed="true"]{background:var(--ink-btn);border-color:var(--ink-btn);color:var(--on-ink)}
.day[aria-pressed="true"] .dn{color:inherit;opacity:.75}
.day[aria-pressed="true"] .dd{color:inherit}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 12px 12px 14px}
.check{flex-shrink:0;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;margin-top:1px}
.check svg{width:18px;height:18px;opacity:0}
.task.done .check{background:var(--verde);border-color:var(--verde);color:#fff}
.task.done .check svg{opacity:1}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.task .ttl{font-weight:700}
.task .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:.8rem;color:var(--muted);align-items:center}
.task .note{font-size:.88rem;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.tag-chef{background:#E4E9F7;color:#2C3F86}
.tag-gerant{background:var(--maiz-soft);color:color-mix(in srgb,var(--maiz) 65%,var(--ink))}
.tag-tous{background:var(--bg);color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag-chef{background:#22294A;color:#A9B7F2}}
:root[data-theme="dark"] .tag-chef{background:#22294A;color:#A9B7F2}

/* Ticket */
.ticket{background:var(--paper);padding:30px 20px 34px;max-width:440px;margin:0 auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.12));
  -webkit-mask:radial-gradient(circle at 50% 0,transparent 6px,#000 6.5px) top/16px 51% repeat-x,radial-gradient(circle at 50% 100%,transparent 6px,#000 6.5px) bottom/16px 51% repeat-x;
  mask:radial-gradient(circle at 50% 0,transparent 6px,#000 6.5px) top/16px 51% repeat-x,radial-gradient(circle at 50% 100%,transparent 6px,#000 6.5px) bottom/16px 51% repeat-x}
.ticket-wrap{filter:drop-shadow(0 6px 14px rgba(0,0,0,.10))}
.ticket h2{font-size:1.5rem;font-weight:800;text-align:center}
.ticket .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-top:4px}
.ticket hr{border:0;border-top:2px dashed var(--line);margin:16px 0}
.tl{display:flex;align-items:baseline;gap:6px;padding:3px 0}
.tl .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.tl .q{color:var(--muted);font-size:.85rem;white-space:nowrap}
.tl .lead{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:12px}
.tl .amt{white-space:nowrap}
.tl.total{font-weight:700;font-size:1.05rem}
.tl.big{font-family:var(--display);font-size:1.35rem;font-weight:800}
.fc-meter{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;position:relative;margin:8px 0 4px}
.fc-meter i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.fc-meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

/* Forms & modal */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100vw);max-width:100vw;max-height:92vh;max-height:92dvh;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,25,.45)}
@media (max-width:599px){
  dialog{margin:auto 0 0;width:100vw;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
.mhead{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;z-index:2;border-bottom:1px solid var(--line)}
.mbody{padding:14px 18px 8px}
.mfoot{position:sticky;bottom:0;background:var(--surface);display:flex;gap:8px;justify-content:space-between;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>span{font-size:.85rem;font-weight:700}
.field small{color:var(--muted);font-size:.8rem}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:9px 6px;cursor:pointer;font-size:.9rem;border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink-btn);color:var(--on-ink);font-weight:700}
.preview{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:.9rem;margin-bottom:14px}
.preview .big{font-family:var(--display);font-size:1.25rem;font-weight:600}
.lines{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 84px 40px;gap:6px;align-items:center}
.line .lc{grid-column:1 / -1;font-size:.8rem;color:var(--muted);margin-top:-4px}
.line select{min-width:0}
.qty-wrap{position:relative}
.qty-wrap input{padding-right:34px}
.qty-wrap em{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-style:normal;font-size:.78rem;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper input{width:58px;text-align:center;padding:6px;min-height:38px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink-btn);color:var(--on-ink);padding:10px 16px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--chile);color:#fff}
@media (min-width:900px){#toast{bottom:32px}}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.8rem;color:var(--muted);font-weight:700;border-top:0}
.hello p{color:var(--muted);margin-top:4px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Couleurs de la marque */
:focus-visible{outline-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.who-chip .av{background:var(--brand)}
.day.today .dd{color:var(--brand)}
.day .dots i{background:var(--brand)}
.day[aria-pressed="true"] .dots i{background:var(--jaune)}
.bottom{background:var(--noir);border-top:0}
.bottom button{color:var(--nav-ink)}
.bottom button[aria-current="page"]{color:var(--jaune)}
@media (min-width:900px){
  .side{background:var(--noir);border-right:0}
  .side button{color:var(--nav-ink)}
  .side button:hover{background:#2B2928;color:#fff}
  .side button[aria-current="page"]{background:var(--brand);color:#fff}
  .side .sep{background:#333030}
}
.more-ico{color:var(--brand)}
.ticket hr{border-top-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.gate{max-width:380px;margin:8vh auto 0;text-align:center}
.gate .logo-big{width:150px;height:150px;border-radius:24px;margin:0 auto 22px;display:block}
.gate form{text-align:left;margin-top:20px}
body.gated .side,body.gated .bottom{display:none}
</style>

/* ============ Utilitaires ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const nf2 = new Intl.NumberFormat("de-CH", {minimumFractionDigits:2, maximumFractionDigits:2});
const nf4 = new Intl.NumberFormat("de-CH", {minimumFractionDigits:2, maximumFractionDigits:4});
const nf0 = new Intl.NumberFormat("de-CH", {maximumFractionDigits:0});
const nfq = new Intl.NumberFormat("de-CH", {maximumFractionDigits:3});
const chf = n => isFinite(n) ? nf2.format(n) + " CHF" : "–";
const chf4 = n => isFinite(n) ? nf4.format(n) + " CHF" : "–";
const pct = n => isFinite(n) ? (n * 100).toFixed(1).replace(".", ",") + " %" : "–";
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".").replace(/['’\s]/g, "")); return isFinite(n) ? n : 0; };
const z2 = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + z2(d.getMonth() + 1) + "-" + z2(d.getDate());
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const addMonths = (s, n) => { const d = parseYmd(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const frDay = s => parseYmd(s).toLocaleDateString("fr-CH", {weekday:"long", day:"numeric", month:"long"});
const frShort = s => parseYmd(s).toLocaleDateString("fr-CH", {weekday:"short", day:"numeric", month:"short"});
const frDM = s => parseYmd(s).toLocaleDateString("fr-CH", {day:"2-digit", month:"2-digit"});
const frMonth = ym => { const s = parseYmd(ym + "-01").toLocaleDateString("fr-CH", {month:"long", year:"numeric"}); return s.charAt(0).toUpperCase() + s.slice(1); };
const hm = iso => { const d = new Date(iso); return z2(d.getHours()) + ":" + z2(d.getMinutes()); };
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : (Math.random().toString(36).slice(2) + Date.now().toString(36))).replace(/-/g, "").slice(0, 16);
const safeSeg = s => String(s || "local").replace(/[^A-Za-z0-9_\-.~:@+]/g, "-").slice(0, 120);

const UNIT = {kg:{base:"g",f:1000}, g:{base:"g",f:1}, l:{base:"ml",f:1000}, cl:{base:"ml",f:10}, ml:{base:"ml",f:1}, "pièce":{base:"pièce",f:1}};

const FREQ = {jour:"par jour d'ouverture", semaine:"par semaine", mois:"par mois", trimestre:"par trimestre", an:"par an"};

/* ============ Stockage (db partagée, ou local en secours) ============ */
const CFG = window.TF_CONFIG || {};
let supa = null;
const Store = {
  mode:"local", local:{}, listeners:{}, q:{}, watchers:{}, channel:null, timers:new Map(),
  async init(){
    if (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase) {
      supa = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true}});
      this.mode = "supa"; return;
    }
    try { this.local = JSON.parse(localStorage.getItem("tf-local") || "{}"); } catch(e){ this.local = {}; }
  },
  /* --- Supabase : une seule table "docs" (collection, id, data jsonb) --- */
  async _fetch(col, filter){
    const out = []; let from = 0;
    for (;;) {
      let q = supa.from("docs").select("id,data").eq("collection", col);
      if (filter) q = q.gte("data->>" + filter.field, filter.value);
      const {data, error} = await q.order("id").range(from, from + 999);
      if (error) throw error;
      data.forEach(r => out.push(Object.assign({}, r.data || {}, {id:r.id})));
      if (data.length < 1000) return out;
      from += 1000;
    }
  },
  _refresh(col){
    const t = this.timers.get(col); if (t) clearTimeout(t);
    this.timers.set(col, setTimeout(() => { this.timers.delete(col);
      (this.watchers[col] || []).forEach(w => this._fetch(col, w.filter).then(w.cb, e => { console.warn(col, e); showStatus(); }));
    }, 120));
  },
  _ensureChannel(){
    if (this.channel) return;
    this.channel = supa.channel("docs-live")
      .on("postgres_changes", {event:"*", schema:"public", table:"docs"}, p => {
        const col = (p.new && p.new.collection) || (p.old && p.old.collection);
        if (col) this._refresh(col); else Object.keys(this.watchers).forEach(c => this._refresh(c));
      })
      .subscribe(st => { if (st === "SUBSCRIBED") { statusMsg = ""; Object.keys(this.watchers).forEach(c => this._refresh(c)); } else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT") showStatus(); });
  },
  _check(r){ if (r && r.error) throw r.error; return r; },
  /* --- API commune --- */
  watch(col, cb, filter){
    if (this.mode === "supa") {
      const w = {cb, filter}; (this.watchers[col] ||= []).push(w);
      this._fetch(col, filter).then(cb, e => { console.warn(col, e); showStatus(); });
      this._ensureChannel();
      return () => { this.watchers[col] = (this.watchers[col] || []).filter(x => x !== w); };
    }
    const fire = () => { let arr = Object.entries(this._col(col)).map(([id, d]) => Object.assign({id}, clone(d))); if (filter) arr = arr.filter(d => String(d[filter.field] ?? "") >= filter.value); cb(arr); };
    (this.listeners[col] ||= []).push(fire); setTimeout(fire, 0);
    return () => { this.listeners[col] = (this.listeners[col] || []).filter(f => f !== fire); };
  },
  _col(c){ return (this.local[c] ||= {}); },
  _persist(c){ try { localStorage.setItem("tf-local", JSON.stringify(this.local)); } catch(e){} (this.listeners[c] || []).forEach(f => f()); },
  _enqueue(key, fn){ const p = (this.q[key] || Promise.resolve()).catch(() => {}).then(fn); this.q[key] = p; return p; },
  set(col, id, data){ return this._enqueue(col + "/" + id, async () => {
    if (this.mode === "supa") { this._check(await supa.from("docs").upsert({collection:col, id, data:clone(data), updated_at:new Date().toISOString()})); return this._refresh(col); }
    this._col(col)[id] = clone(data); this._persist(col); }); },
  update(col, id, patch){ return this._enqueue(col + "/" + id, async () => {
    if (this.mode === "supa") {
      const r = this._check(await supa.from("docs").select("data").eq("collection", col).eq("id", id).maybeSingle());
      const data = Object.assign({}, (r.data && r.data.data) || {}, clone(patch));
      this._check(await supa.from("docs").upsert({collection:col, id, data, updated_at:new Date().toISOString()})); return this._refresh(col);
    }
    Object.assign(this._col(col)[id] ||= {}, clone(patch)); this._persist(col); }); },
  del(col, id){ return this._enqueue(col + "/" + id, async () => {
    if (this.mode === "supa") { this._check(await supa.from("docs").delete().eq("collection", col).eq("id", id)); return this._refresh(col); }
    delete this._col(col)[id]; this._persist(col); }); },
  async get(col, id){
    if (this.mode === "supa") { const r = this._check(await supa.from("docs").select("data").eq("collection", col).eq("id", id).maybeSingle()); return r.data ? clone(r.data.data) : null; }
    const d = this._col(col)[id]; return d ? clone(d) : null; },
  async all(col){
    if (this.mode === "supa") return this._fetch(col);
    return Object.entries(this._col(col)).map(([id, d]) => Object.assign({id}, clone(d)));
  }
};

/* ============ Calculs ============ */
function ingUnitCost(i){
  if (!i) return 0;
  const u = UNIT[i.packUnit] || UNIT["pièce"];
  const q = num(i.packQty) * u.f; if (!q) return 0;
  const loss = Math.min(Math.max(num(i.loss), 0), 95);
  return num(i.packPrice) / q / (1 - loss / 100);
}
const ingBase = i => (UNIT[i && i.packUnit] || UNIT["pièce"]).base;
function ingRefPrice(i){
  const b = ingBase(i), c = ingUnitCost(i);
  if (b === "g") return chf(c * 1000) + " / kg";
  if (b === "ml") return chf(c * 1000) + " / l";
  return chf4(c) + " / pièce";
}
function lineBase(l){ if (l.kind === "prep") { const p = IX.rec[l.ref]; return p ? (p.yieldUnit || "pièce") : ""; } const i = IX.ing[l.ref]; return i ? ingBase(i) : ""; }
function lineName(l){ return l.kind === "prep" ? (IX.rec[l.ref] ? IX.rec[l.ref].name : "Préparation supprimée") : (IX.ing[l.ref] ? IX.ing[l.ref].name : "Matière supprimée"); }
function lineCost(l, depth){
  if (l.kind === "prep") { const p = IX.rec[l.ref]; if (!p || !num(p.yieldQty)) return 0; return recipeCost(p, depth + 1) / num(p.yieldQty) * num(l.qty); }
  return ingUnitCost(IX.ing[l.ref]) * num(l.qty);
}
function recipeCost(r, depth = 0){ if (depth > 6 || !r) return 0; return (r.lines || []).reduce((s, l) => s + lineCost(l, depth), 0); }
function recipeStats(r){
  const cost = recipeCost(r), vat = r.vat != null ? num(r.vat) : num(S.settings.vatOnsite), ttc = num(r.price);
  const ht = ttc / (1 + vat / 100), margin = ht - cost, target = num(S.settings.target) / 100;
  return {cost, vat, ttc, ht, margin, fc: ht ? cost / ht : NaN, coef: cost ? ht / cost : NaN, marginRate: ht ? margin / ht : NaN, suggestTTC: target ? cost / target * (1 + vat / 100) : NaN};
}
function fcClass(fc){ const t = num(S.settings.target) / 100; if (!isFinite(fc)) return "neutral"; if (fc <= t) return "ok"; if (fc <= t + 0.05) return "warn"; return "bad"; }
function qtyLabel(q, base){ q = num(q); if (base === "g" && q >= 1000) return nfq.format(q / 1000) + " kg"; if (base === "ml" && q >= 1000) return nfq.format(q / 1000) + " l"; return nfq.format(q) + " " + (base === "pièce" ? (q > 1 ? "pièces" : "pièce") : base); }
function recipesUsing(ingId){
  const direct = r => (r.lines || []).some(l => l.kind === "ing" && l.ref === ingId);
  const out = new Set(S.recipes.filter(direct).map(r => r.id));
  let grew = true;
  while (grew) { grew = false; for (const r of S.recipes) if (!out.has(r.id) && (r.lines || []).some(l => l.kind === "prep" && out.has(l.ref))) { out.add(r.id); grew = true; } }
  return S.recipes.filter(r => out.has(r.id));
}
function withIngOverride(id, tmp, fn){ const old = IX.ing[id]; IX.ing[id] = tmp; try { return fn(); } finally { if (old) IX.ing[id] = old; else delete IX.ing[id]; } }
const soldRecipes = () => S.recipes.filter(r => r.type !== "prep");

function chargeMonthly(c){ const a = num(c.amount); switch (c.freq) { case "jour": return a * num(S.settings.openDays); case "semaine": return a * 52 / 12; case "trimestre": return a / 3; case "an": return a / 12; default: return a; } }
function chargesTotals(){ const m = S.charges.reduce((s, c) => s + chargeMonthly(c), 0); const od = num(S.settings.openDays) || 26; return {month:m, day:m / od, year:m * 12}; }
function saleTotals(doc){ let ttc = 0, ht = 0, cost = 0, qty = 0; for (const it of Object.values(doc.items || {})) { const q = num(it.q); ttc += q * num(it.p); ht += q * num(it.p) / (1 + num(it.v) / 100); cost += q * num(it.c); qty += q; } return {ttc, ht, cost, qty, margin:ht - cost}; }
function monthStats(ym){
  const days = S.sales.filter(s => String(s.date || s.id).startsWith(ym)).sort((a, b) => b.id.localeCompare(a.id));
  const t = {ttc:0, ht:0, cost:0, qty:0, margin:0, days, products:{}};
  for (const d of days) { const x = saleTotals(d); t.ttc += x.ttc; t.ht += x.ht; t.cost += x.cost; t.qty += x.qty; t.margin += x.margin;
    for (const [rid, it] of Object.entries(d.items || {})) { const p = (t.products[rid] ||= {name:it.n || (IX.rec[rid] && IX.rec[rid].name) || "Produit", q:0, margin:0}); const q = num(it.q); p.q += q; p.margin += q * (num(it.p) / (1 + num(it.v) / 100) - num(it.c)); } }
  return t;
}
function breakEven(){
  const ch = chargesTotals(), od = num(S.settings.openDays) || 26;
  const m = monthStats(today.slice(0, 7));
  let rate, perItem;
  if (m.ht > 0) { rate = m.margin / m.ht; perItem = m.qty ? m.margin / m.qty : NaN; }
  else { const st = soldRecipes().filter(r => num(r.price) > 0).map(recipeStats); rate = st.length ? st.reduce((s, x) => s + x.marginRate, 0) / st.length : NaN; perItem = st.length ? st.reduce((s, x) => s + x.margin, 0) / st.length : NaN; }
  const caMonth = rate > 0 ? ch.month / rate : NaN;
  return {rate, caMonth, caDay:caMonth / od, itemsDay:perItem > 0 ? ch.day / perItem : NaN, basedOnSales:m.ht > 0};
}

/* ============ Journal ============ */
let logChain = Promise.resolve(), myLog = {key:null, entries:[]};
function log(action, detail){
  logChain = logChain.catch(() => {}).then(async () => {
    const d = todayStr(), key = d + "_" + me.key;
    if (myLog.key !== key) { let ex = null; try { ex = await Store.get("journal", key); } catch(e){} myLog = {key, entries:ex && Array.isArray(ex.entries) ? ex.entries : []}; }
    myLog.entries.push({t:new Date().toISOString(), a:action, d:detail || ""});
    if (myLog.entries.length > 600) myLog.entries.splice(0, myLog.entries.length - 600);
    await Store.set("journal", key, {date:d, user:me.key, entries:myLog.entries.slice()});
  });
  return logChain;
}
function memberLabel(key){ const m = IX.team[key]; return m ? (m.label || ROLE[m.role] || "Membre") : "Membre"; }

/* ============ Actions communes ============ */
async function save(promise, ok){
  try { await promise; if (ok) toast(ok); return true; }
  catch(e){ console.error(e); toast(e && e.code === "quota_exceeded" ? "Stockage plein : supprime d'anciennes données." : "Enregistrement refusé. Vérifie que tu as l'accès en modification.", true); return false; }
}
let toastT;
function toast(msg, err){ const t = $("#toast"); t.textContent = msg; t.className = "show" + (err ? " err" : ""); clearTimeout(toastT); toastT = setTimeout(() => t.className = "", 2600); }
function showStatus(code){ statusMsg = "Connexion instable, les données se resynchronisent."; schedule(); }

/* ============ Rendu ============ */
let raf = 0;
function schedule(){ if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
const NAV = [
  ["home","Accueil"],["tasks","Tâches"],["recipes","Recettes"],["ingredients","Matières premières"],["sales","Ventes"],["charges","Charges"],["journal","Journal"],["settings","Réglages"]

function render(){
  renderNav();
  const main = $("#main");
  document.body.classList.toggle("gated", !!gate);
  if (gate) { if (!main.querySelector("[data-gate='" + gate + "']")) main.innerHTML = gateView(); return; }
  if (!S.ready.has("settings") || !S.ready.has("team")) { main.innerHTML = '<div class="loading">Chargement…</div>'; return; }
  const a = document.activeElement, aid = a && main.contains(a) && a.id ? a.id : null, sel = aid && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
  const fn = VIEWS[UI.view] || VIEWS.home;
  main.innerHTML = topbar() + banners() + fn();
  if (aid) { const n = document.getElementById(aid); if (n) { n.focus(); if (sel && n.setSelectionRange) try { n.setSelectionRange(sel[0], sel[1]); } catch(e){} } }
}
let gate = null, gateMsg = "";
function gateView(){
  const head = `<img class="logo-big" src="${LOGO}" alt="The Tacos Factory Genève"><h1>Gestion interne</h1>`;
  if (gate === "denied") return `<div class="gate" data-gate="denied">${head}<p class="muted" style="margin-top:10px">Ce compte (${esc(me.name)}) n'est pas autorisé. Demande au gérant d'ajouter ton e-mail dans la liste des membres.</p><p style="margin-top:18px"><button class="btn" data-act="logout">Se déconnecter</button></p></div>`;
  return `<div class="gate" data-gate="login">${head}<p class="muted" style="margin-top:6px">Connecte-toi avec ton e-mail et ton mot de passe.</p>

  <button class="btn primary" type="submit" style="width:100%">Se connecter</button></form></div>`;
}
function topbar(){
  const init = (me.label || "?").trim().charAt(0).toUpperCase();
  return `<div class="topbar"><div class="brand"><img class="logo" src="${LOGO}" alt="The Tacos Factory Genève"></div><span></span><button class="who-chip" data-act="openProfile" aria-label="Mon profil"><span class="av">${esc(init)}</span>${esc(me.label || "Profil")}</button></div>`;

function banners(){

  if (Store.mode === "local") h += '<div class="banner info">Mode local : la base de données n\'est pas configurée (fichier config.js), les données restent sur cet appareil.</div>';
  if (canWrite === false) h += '<div class="banner info">Tu as un accès en lecture seule. Demande au gérant de te passer en modification.</div>';

}

/* ---------- Accueil ---------- */
function viewHome(){
  const mine = S.tasks.filter(t => t.date === today && matchWho(t, "mine")).sort(taskSort);
  const m = monthStats(today.slice(0, 7)), ch = chargesTotals();
  const result = m.margin - ch.month;
  const over = soldRecipes().filter(r => num(r.price) > 0).map(r => [r, recipeStats(r)]).filter(([, s]) => fcClass(s.fc) === "bad").sort((a, b) => b[1].fc - a[1].fc);
  const since = addDays(today, -21);
  const changes = [];
  S.ingredients.forEach(i => (i.history || []).forEach(h => { if (h.d >= since) changes.push([i, h]); }));
  changes.sort((a, b) => b[1].d.localeCompare(a[1].d));
  const pend = mine.filter(t => !t.done).length;
  let h = `<header class="hello"><h1>Bonjour ${esc(me.label || "")}</h1><p>${esc(frDay(today))}</p></header>`;
  h += `<section class="section"><div class="section-head"><h2>Tes tâches du jour</h2><button class="btn sm ghost" data-act="go" data-v="tasks">Tout voir</button></div>`;

    `<div class="panel empty">Rien de prévu pour toi aujourd'hui.<br><button class="btn primary" data-act="newTask">Ajouter une tâche</button></div>`;

  ${!m.days.length ? '<p class="small muted" style="margin-top:6px">Saisis tes ventes pour voir le résultat du mois.</p>' : ""}</section>`;

    h += `<section class="section"><div class="panel empty"><h3>Commence par tes matières premières</h3><p class="small" style="margin-top:6px">Ajoute ce que tu achètes (prix et conditionnement), puis compose tes recettes : les coûts se calculent tout seuls.</p><button class="btn primary" data-act="newIng">Ajouter une matière première</button></div></section>`;
  }

    h += `<section class="section"><div class="section-head"><h2>Food cost au-dessus de ${nf0.format(num(S.settings.target))} %</h2></div><ul class="list">${over.slice(0, 6).map(([r, s]) =>
      `<li><button class="row" data-act="openRecipe" data-id="${r.id}"><span class="grow"><span class="t">${esc(r.name)}</span><br><span class="s">Coût ${chf(s.cost)}, vendu ${chf(s.ttc)}</span></span><span class="pill bad">${pct(s.fc)}</span></button></li>`).join("")}</ul></section>`;
  }

    h += `<section class="section"><div class="section-head"><h2>Prix modifiés récemment</h2></div><ul class="list">${changes.slice(0, 6).map(([i, c]) => {
      const d = num(c.from) ? (num(c.to) - num(c.from)) / num(c.from) : 0;
      return `<li><button class="row" data-act="editIng" data-id="${i.id}"><span class="grow"><span class="t">${esc(i.name)}</span><br><span class="s">${esc(frDM(c.d))} : ${chf(num(c.from))} → ${chf(num(c.to))}</span></span><span class="pill ${d > 0 ? "bad" : "ok"}">${d > 0 ? "+" : ""}${pct(d)}</span></button></li>`; }).join("")}</ul></section>`;
  }
  return h;
}

/* ---------- Tâches ---------- */
function myRole(){ return me.role === "chef" ? "chef" : me.role === "gerant" ? "gerant" : null; }
function matchWho(t, f){ if (f === "all") return true; if (f === "mine") { const r = myRole(); return !r || t.who === r || t.who === "tous"; } return t.who === f || t.who === "tous"; }
function taskSort(a, b){ return (a.done ? 1 : 0) - (b.done ? 1 : 0) || String(a.createdAt || "").localeCompare(String(b.createdAt || "")); }
function taskItem(t){
  const late = t.origDate && t.origDate < t.date && !t.done ? daysBetween(t.origDate, t.date) : 0;
  let meta = `<span class="pill tag-${esc(t.who || "tous")}">${esc(WHO[t.who] || "Les deux")}</span>`;
  if (late) meta += `<span class="pill warn">Reportée, prévue le ${esc(frDM(t.origDate))}</span>`;
  if (t.repeat && t.repeat !== "none") meta += `<span>${esc(REPEAT[t.repeat])}</span>`;
  if (t.done && t.doneBy) meta += `<span>Fait par ${esc(memberLabel(t.doneBy))} à ${esc(hm(t.doneAt))}</span>`;
  return `<li class="task ${t.done ? "done" : ""}"><button class="check" data-act="toggleTask" data-id="${t.id}" aria-pressed="${!!t.done}" aria-label="${t.done ? "Marquer à faire" : "Marquer comme fait"}">${ICON.check}</button>
    <div style="flex:1;min-width:0"><div class="ttl">${esc(t.title)}</div>${t.note ? `<div class="note">${esc(t.note)}</div>` : ""}<div class="meta">${meta}</div></div>
    <button class="icon-btn" data-act="editTask" data-id="${t.id}" aria-label="Modifier la tâche">${ICON.edit}</button></li>`;
}
function viewTasks(){
  const sel = UI.taskDate, d0 = parseYmd(sel), mon = addDays(sel, -((d0.getDay() + 6) % 7));
  const names = ["lun","mar","mer","jeu","ven","sam","dim"];
  let week = "";
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), n = S.tasks.filter(t => t.date === d && !t.done && matchWho(t, UI.taskFilter)).length;
    week += `<button class="day ${d === today ? "today" : ""}" data-act="pickDay" data-d="${d}" aria-pressed="${d === sel}"><div class="dn">${names[i]}</div><div class="dd">${parseYmd(d).getDate()}</div><div class="dots">${"<i></i>".repeat(Math.min(n, 4))}</div></button>`;
  }
  const items = S.tasks.filter(t => t.date === sel && matchWho(t, UI.taskFilter)).sort(taskSort);
  const filt = [["mine","Mes tâches"],["all","Toutes"],["chef","Chef"],["gerant","Gérant"]];
  return `<div class="section-head"><h1>Tâches</h1></div>
  <div class="chips" role="group" aria-label="Filtrer">${filt.map(([k, l]) => `<button class="chip" data-act="taskFilter" data-f="${k}" aria-pressed="${UI.taskFilter === k}">${l}</button>`).join("")}</div>
  <div class="weeknav" style="margin-top:14px"><button class="icon-btn" data-act="weekShift" data-n="-7" aria-label="Semaine précédente">${ICON.left}</button>
  <strong>${esc(frDay(sel))}</strong><button class="icon-btn" data-act="weekShift" data-n="7" aria-label="Semaine suivante">${ICON.right}</button></div>
  <div class="week">${week}</div>
  ${sel !== today ? `<p style="margin:-4px 0 10px"><button class="btn sm ghost" data-act="pickDay" data-d="${today}">Revenir à aujourd'hui</button></p>` : ""}
  ${items.length ? `<ul class="list">${items.map(taskItem).join("")}</ul>` : `<div class="panel empty">Aucune tâche ce jour-là.</div>`}
  <p class="small muted" style="margin-top:10px">Une tâche non cochée passe automatiquement au jour suivant.</p>
  <button class="btn primary fab" data-act="newTask">+ Tâche</button>`;
}
function nextDate(d, rep){ if (rep === "daily") return addDays(d, 1); if (rep === "weekly") return addDays(d, 7); if (rep === "monthly") return addMonths(d, 1); return d; }
const carrying = new Set();
function carryOver(){
  for (const t of S.tasks) if (!t.done && t.date < today && !carrying.has(t.id)) {
    carrying.add(t.id);
    Store.update("tasks", t.id, {date:today, origDate:t.origDate || t.date}).catch(() => {}).finally(() => carrying.delete(t.id));
  }
}

  if (!S.ingredients.length) return h + `<div class="panel empty">Ajoute ce que tu achètes avec son prix HT et son conditionnement : 1 kg de viande hachée à 15.90, un carton de 108 galettes à 28.00…<br><button class="btn primary" data-act="newIng">Ajouter une matière première</button></div>`;

      return `<li><button class="row" data-act="editIng" data-id="${i.id}"><span class="grow"><span class="t">${esc(i.name)}</span><br><span class="s">${esc(qtyLabel(num(i.packQty) * (UNIT[i.packUnit] || UNIT["pièce"]).f, ingBase(i)))} à ${chf(num(i.packPrice))} HT${i.supplier ? ", " + esc(i.supplier) : ""}${num(i.loss) ? `, perte ${nfq.format(num(i.loss))} %` : ""}</span></span>

  }

  return h + `<button class="btn primary fab" data-act="newIng">+ Matière</button>`;

/* ---------- Journal ---------- */
let journalUnsub = null;
function subscribeJournal(){
  if (journalUnsub) try { journalUnsub(); } catch(e){}
  S.ready.delete("journal");
  journalUnsub = Store.watch("journal", d => setS("journal", null, d), {field:"date", op:">=", value:addDays(today, -(UI.journalDays - 1))});
}
function viewJournal(){
  const entries = [];
  S.journal.forEach(doc => { if (UI.journalWho !== "all" && doc.user !== UI.journalWho) return; (doc.entries || []).forEach(e => entries.push(Object.assign({u:doc.user, day:doc.date}, e))); });
  entries.sort((a, b) => String(b.t).localeCompare(String(a.t)));
  const per = [[1,"Aujourd'hui"],[7,"7 jours"],[30,"30 jours"],[90,"90 jours"]];
  let h = `<div class="section-head"><h1>Journal</h1></div><p class="muted small" style="margin-bottom:12px">Chaque modification faite dans le logiciel, avec qui l'a faite et quand.</p>
  <div class="chips">${per.map(([n, l]) => `<button class="chip" data-act="journalDays" data-n="${n}" aria-pressed="${UI.journalDays === n}">${l}</button>`).join("")}</div>
  <div class="chips" style="margin-top:8px"><button class="chip" data-act="journalWho" data-k="all" aria-pressed="${UI.journalWho === "all"}">Tout le monde</button>${S.team.map(m => `<button class="chip" data-act="journalWho" data-k="${esc(m.id)}" aria-pressed="${UI.journalWho === m.id}">${esc(m.label || "Membre")}</button>`).join("")}</div>`;
  if (!S.ready.has("journal")) return h + `<div class="loading">Chargement…</div>`;
  if (!entries.length) return h + `<div class="panel empty" style="margin-top:14px">Aucune action sur cette période.</div>`;
  let cur = "", out = "";
  for (const e of entries.slice(0, 800)) {
    const d = ymd(new Date(e.t));
    if (d !== cur) { if (cur) out += `</ul>`; cur = d; out += `<div class="group-label">${esc(frDay(d))}</div><ul class="list">`; }
    out += `<li><div class="row" style="cursor:default"><span class="small muted" style="width:44px">${esc(hm(e.t))}</span><span class="grow"><span class="t">${esc(e.a)}</span>${e.d ? `<br><span class="s">${esc(e.d)}</span>` : ""}</span><span class="pill ${(IX.team[e.u] || {}).role === "chef" ? "tag-chef" : "tag-gerant"}">${esc(memberLabel(e.u))}</span></div></li>`;
  }
  return h + `<div style="margin-top:6px">${out}</ul></div>`;
}

async function saveTask(id){

  } else {

    if (await save(Store.set("tasks", newId(), data), "Tâche ajoutée")) { closeModal(); log("Tâche ajoutée", `${title} (${WHO[data.who]}, ${frDM(date)})`); }
  }

async function toggleTask(id){
  const t = IX.task[id]; if (!t) return;
  const done = !t.done, patch = {done, doneBy:done ? me.key : null, doneAt:done ? new Date().toISOString() : null};
  let spawn = null;
  if (done && t.repeat && t.repeat !== "none" && !t.spawned) {
    let nd = nextDate(t.date, t.repeat); while (nd <= today) nd = nextDate(nd, t.repeat);
    spawn = {title:t.title, note:t.note || "", who:t.who, date:nd, repeat:t.repeat, done:false, createdBy:t.createdBy || me.key, createdAt:new Date().toISOString()};
    patch.spawned = true;
  }
  if (await save(Store.update("tasks", id, patch))) {
    if (spawn) await save(Store.set("tasks", newId(), spawn));
    log(done ? "Tâche faite" : "Tâche remise à faire", t.title);
  }
}
async function delTask(id){

  draft.lines.forEach((l, k) => { const e = $("#lc" + k); if (e) e.textContent = l.ref ? chf4(lineCost(l, 0)) : ""; });
  if (r.type === "prep") { const y = num(r.yieldQty); box.innerHTML = `<div class="small muted">Coût total</div><div class="big">${chf(s.cost)}</div>${y ? `<div class="small">${r.yieldUnit === "pièce" ? chf4(s.cost / y) + " par pièce" : chf4(s.cost / y) + " par " + r.yieldUnit + " (" + chf(s.cost / y * 1000) + " / " + (r.yieldUnit === "ml" ? "l" : "kg") + ")"}</div>` : ""}`; return; }
  box.innerHTML = `<div class="grid2"><div><div class="small muted">Coût de revient</div><div class="big">${chf(s.cost)}</div></div><div><div class="small muted">Marge brute HT</div><div class="big ${s.margin >= 0 ? "pos" : "neg"}">${r.price ? chf(s.margin) : "–"}</div></div></div>
  ${r.price ? `<div style="margin-top:6px">Food cost <span class="pill ${fcClass(s.fc)}">${pct(s.fc)}</span></div>` : ""}<div class="small muted" style="margin-top:6px">Prix TTC conseillé pour ${nf0.format(num(S.settings.target))} % : ${chf(s.suggestTTC)}</div>`;
}
async function saveRecipe(id){
  const r = readRecipe();
  if (!r.name) return toast("Donne un nom à la recette.", true);
  if (r.type === "prep" && !r.yieldQty) return toast("Indique la quantité obtenue par la préparation.", true);
  const lines = r.lines.filter(l => l.ref && num(l.qty) > 0).map(l => ({kind:l.kind, ref:l.ref, qty:num(l.qty)}));
  const data = {name:r.name, type:r.type, category:r.category, lines, price:r.type === "prep" ? 0 : r.price, vat:r.vat, yieldQty:r.type === "prep" ? r.yieldQty : 0, yieldUnit:r.yieldUnit, updatedAt:new Date().toISOString()};
  const rid = id || newId(), old = id ? IX.rec[id] : null;
  if (await save(Store.set("recipes", rid, data), "Recette enregistrée")) {
    closeModal();
    let detail = r.name;
    if (old && r.type !== "prep" && num(old.price) !== r.price) detail += ` : prix ${chf(num(old.price))} → ${chf(r.price)}`;
    log(id ? "Recette modifiée" : "Recette créée", detail);
    UI.view = "recipe"; UI.recipeId = rid; schedule();
  }
}
async function delRecipe(id){
  const r = IX.rec[id]; if (!r) return;
  const users = S.recipes.filter(x => (x.lines || []).some(l => l.kind === "prep" && l.ref === id));
  if (users.length) return toast(`Utilisée dans : ${users.map(x => x.name).slice(0, 3).join(", ")}. Retire-la d'abord.`, true);
  if (!confirm(`Supprimer la recette « ${r.name} » ?`)) return;
  if (await save(Store.del("recipes", id), "Recette supprimée")) { log("Recette supprimée", r.name); UI.view = "recipes"; schedule(); }
}

/* ---- Ventes ---- */
let saleDraft = null;
async function openSale(date){
  date = date || today;
  const ex = IX.sale[date];
  saleDraft = {date, items:{}, cash:ex && num(ex.cash) ? num(ex.cash) : ""};
  if (ex) for (const [rid, it] of Object.entries(ex.items || {})) saleDraft.items[rid] = num(it.q);
  const groups = {};
  soldRecipes().sort(byName).forEach(r => (groups[r.category || "Autres"] ||= []).push(r));
  openModal("Ventes du jour",
    `<label class="field"><span>Date</span><input name="sdate" type="date" value="${esc(date)}" data-act-change="saleDate"></label>
    ${Object.keys(groups).sort((a, b) => a.localeCompare(b, "fr")).map(c => `<div class="group-label">${esc(c)}</div>${groups[c].map(r => `<div class="row" style="padding:6px 0;cursor:default"><span class="grow"><span class="t">${esc(r.name)}</span><br><span class="s">${chf(num(r.price))}</span></span>
      <span class="stepper"><button type="button" data-act="step" data-rid="${r.id}" data-n="-1" aria-label="Moins">−</button><input id="sq-${r.id}" data-sq="${r.id}" type="number" min="0" step="1" inputmode="numeric" value="${saleDraft.items[r.id] || ""}" aria-label="Quantité ${esc(r.name)}"><button type="button" data-act="step" data-rid="${r.id}" data-n="1" aria-label="Plus">+</button></span></div>`).join("")}`).join("")}
    <label class="field" style="margin-top:16px"><span>CA réel de la caisse TTC (facultatif)</span><input name="cash" type="number" step="0.05" min="0" inputmode="decimal" value="${esc(saleDraft.cash)}"><small>Pour repérer un écart entre la caisse et les quantités saisies.</small></label>
    <div class="preview" id="salePreview"></div>`,
    `${ex ? `<button class="btn danger" data-act="delSale" data-d="${date}">Supprimer ce jour</button>` : "<span></span>"}<button class="btn primary" data-act="saveSale">Enregistrer les ventes</button>`, {type:"sale"});
  salePreview();
}
function salePreview(){
  const box = $("#salePreview"); if (!box) return;
  const doc = buildSaleDoc(), x = saleTotals(doc);
  box.innerHTML = `<div class="grid2"><div><div class="small muted">CA TTC</div><div class="big">${chf(x.ttc)}</div></div><div><div class="small muted">Marge brute</div><div class="big">${chf(x.margin)}</div></div></div><div class="small muted" style="margin-top:4px">${nf0.format(x.qty)} produits, coût matière ${chf(x.cost)}</div>`;
}
function buildSaleDoc(){
  const items = {};
  for (const [rid, q] of Object.entries(saleDraft.items)) { if (!(num(q) > 0)) continue; const r = IX.rec[rid]; if (!r) continue; items[rid] = {q:num(q), p:num(r.price), v:r.vat != null ? num(r.vat) : num(S.settings.vatOnsite), c:Math.round(recipeCost(r) * 10000) / 10000, n:r.name}; }
  return {date:saleDraft.date, items, cash:num(fv("cash")), by:me.key, updatedAt:new Date().toISOString()};
}
async function saveSale(){
  const doc = buildSaleDoc();
  if (!Object.keys(doc.items).length && !doc.cash) return toast("Saisis au moins une quantité.", true);
  const x = saleTotals(doc), existed = !!IX.sale[doc.date];
  if (await save(Store.set("sales", doc.date, doc), "Ventes enregistrées")) { closeModal(); log(existed ? "Ventes modifiées" : "Ventes saisies", `${frShort(doc.date)} : ${nf0.format(x.qty)} produits, ${chf(x.ttc)} TTC`); }
}
async function delSale(d){ if (!confirm(`Supprimer les ventes du ${frShort(d)} ?`)) return; if (await save(Store.del("sales", d), "Ventes supprimées")) { closeModal(); log("Ventes supprimées", frShort(d)); } }

/* ---- Charges ---- */
function openCharge(id){
  const c = id ? IX.charge[id] : {name:"", category:"", amount:"", freq:"mois", note:""};
  if (!c) return;
  openModal(id ? "Modifier la charge" : "Nouvelle charge",
    `<label class="field"><span>Nom</span><input name="name" type="text" value="${esc(c.name)}" placeholder="Ex. loyer du local"></label>
    <label class="field"><span>Catégorie</span><input name="category" list="dlChCat" value="${esc(c.category || "")}"></label>${datalist("dlChCat", CHARGE_CATS)}
    <div class="grid2"><label class="field"><span>Montant (CHF)</span><input name="amount" type="number" step="0.05" min="0" inputmode="decimal" value="${esc(c.amount)}"></label>
    <label class="field"><span>Fréquence</span><select name="freq">${Object.entries(FREQ).map(([k, l]) => `<option value="${k}" ${c.freq === k ? "selected" : ""}>${l}</option>`).join("")}</select></label></div>
    <label class="field"><span>Note (facultatif)</span><input name="note" type="text" value="${esc(c.note || "")}" placeholder="Ex. échéance, contrat, fournisseur"></label>`,
    `${id ? `<button class="btn danger" data-act="delCharge" data-id="${id}">Supprimer</button>` : "<span></span>"}<button class="btn primary" data-act="saveCharge" data-id="${id || ""}">Enregistrer</button>`);
}
async function saveCharge(id){
  const d = {name:fv("name").trim(), category:fv("category").trim() || "Autres", amount:num(fv("amount")), freq:fv("freq"), note:fv("note").trim(), updatedAt:new Date().toISOString()};
  if (!d.name) return toast("Donne un nom à la charge.", true);
  const old = id ? IX.charge[id] : null;
  if (await save(Store.set("charges", id || newId(), d), "Charge enregistrée")) {
    closeModal();
    log(id ? "Charge modifiée" : "Charge ajoutée", `${d.name} : ${old && num(old.amount) !== d.amount ? chf(num(old.amount)) + " → " : ""}${chf(d.amount)} ${FREQ[d.freq]}`);
  }
}
async function delCharge(id){ const c = IX.charge[id]; if (!c || !confirm(`Supprimer « ${c.name} » ?`)) return; if (await save(Store.del("charges", id), "Charge supprimée")) { closeModal(); log("Charge supprimée", c.name); } }

/* ============ Événements ============ */
async function exportData(){
  const out = {app:"tacos-factory-gestion", version:1, exportedAt:new Date().toISOString(), collections:{}};
  for (const c of ["ingredients","recipes","charges","tasks","sales","settings","team","journal"]) { out.collections[c] = {}; (await Store.all(c)).forEach(d => { const id = d.id; delete d.id; out.collections[c][id] = d; }); }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type:"application/json"}));
  a.download = "tacos-factory-sauvegarde-" + todayStr() + ".json"; document.body.appendChild(a); a.click(); a.remove();
  log("Sauvegarde téléchargée", "");
}
async function importData(file){
  let j; try { j = JSON.parse(await file.text()); } catch(e){ return toast("Fichier illisible.", true); }
  const cols = j && j.collections; if (!cols) return toast("Ce n'est pas une sauvegarde du logiciel.", true);
  const keep = ["ingredients","recipes","charges","tasks","sales","settings","journal"];
  const n = keep.reduce((t, c) => t + Object.keys(cols[c] || {}).length, 0);
  if (!n || !confirm(`Importer ${n} élément(s) ? Les éléments déjà présents avec le même identifiant seront remplacés.`)) return;
  let ok = 0;
  for (const c of keep) for (const [id, d] of Object.entries(cols[c] || {})) { try { await Store.set(c, safeSeg(id), d); ok++; } catch(e){ console.warn(e); } }
  toast(`${ok} élément(s) importé(s)`); log("Sauvegarde importée", `${ok} élément(s)`);
}
const ACT = {
  logout:async () => { if (supa) await supa.auth.signOut(); location.reload(); },
  exportData:() => exportData().catch(e => { console.error(e); toast("Export impossible.", true); }),
  go:d => { UI.view = d.v; window.scrollTo(0, 0); schedule(); },
  openProfile:() => openProfile(false), saveProfile,
  closeModal,
  newTask:() => openTask(null), editTask:d => openTask(d.id), saveTask:d => saveTask(d.id || null), delTask:d => delTask(d.id), toggleTask:d => toggleTask(d.id),
  pickDay:d => { UI.taskDate = d.d; schedule(); }, weekShift:d => { UI.taskDate = addDays(UI.taskDate, num(d.n)); schedule(); }, taskFilter:d => { UI.taskFilter = d.f; schedule(); },
  newIng:() => openIng(null), editIng:d => openIng(d.id), saveIng:d => saveIng(d.id || null), delIng:d => delIng(d.id), ingCat:d => { UI.ingCat = d.c; schedule(); },
  newRecipe:() => openRecipeEditor(null), editRecipe:d => openRecipeEditor(d.id), dupRecipe:d => openRecipeEditor(null, d.id), delRecipe:d => delRecipe(d.id), saveRecipe:d => saveRecipe(d.id || null),
  openRecipe:d => { UI.view = "recipe"; UI.recipeId = d.id; window.scrollTo(0, 0); schedule(); },
  addLine:() => { readRecipe(); draft.lines.push({kind:"ing", ref:"", qty:""}); renderLines(); recPreview(); },
  rmLine:d => { readRecipe(); draft.lines.splice(num(d.k), 1); renderLines(); recPreview(); },
  openSale:d => openSale(d.d), saveSale, delSale:d => delSale(d.d),
  step:d => { const i = $("#sq-" + d.rid); const v = Math.max(0, num(i.value) + num(d.n)); i.value = v || ""; saleDraft.items[d.rid] = v; salePreview(); },
  monthShift:d => { UI.salesMonth = addMonths(UI.salesMonth + "-01", num(d.n)).slice(0, 7); schedule(); },
  newCharge:() => openCharge(null), editCharge:d => openCharge(d.id), saveCharge:d => saveCharge(d.id || null), delCharge:d => delCharge(d.id),
  journalDays:d => { UI.journalDays = num(d.n); subscribeJournal(); schedule(); }, journalWho:d => { UI.journalWho = d.k; schedule(); },
};
document.addEventListener("click", e => { const a = e.target.closest("[data-act]"); if (!a) return; const f = ACT[a.dataset.act]; if (f) { e.preventDefault(); f(a.dataset, a); } });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.input) { UI[t.dataset.input] = t.value; schedule(); return; }
  if (!modal.contains(t)) return;
  if (modalCtx && modalCtx.type === "ing") ingPreview();
  if (modalCtx && modalCtx.type === "rec") {
    if (t.dataset.line != null && t.dataset.f === "qty") draft.lines[num(t.dataset.line)].qty = t.value;
    if (t.name === "type") { $("#soldFields").hidden = t.value === "prep"; $("#prepFields").hidden = t.value !== "prep"; }
    recPreview();
  }
  if (modalCtx && modalCtx.type === "sale") { if (t.dataset.sq) saleDraft.items[t.dataset.sq] = num(t.value); salePreview(); }
});
document.addEventListener("change", e => {
  const t = e.target; if (!modal.contains(t)) return;
  if (modalCtx && modalCtx.type === "rec" && t.dataset.line != null && t.dataset.f === "ref") {
    readRecipe(); const [kind, ref] = (t.value || ":").split(":"); const l = draft.lines[num(t.dataset.line)]; l.kind = kind || "ing"; l.ref = ref || "";
    renderLines(); recPreview(); const q = $("#lq" + t.dataset.line); if (q && !q.value) q.focus();
  }
  if (t.dataset.actChange === "saleDate" && t.value) openSale(t.value);
});
document.addEventListener("change", e => { const t = e.target; if (t.dataset && t.dataset.import != null && t.files && t.files[0]) { importData(t.files[0]); t.value = ""; } });
document.addEventListener("submit", async e => {
  const f = e.target;
  if (f.dataset.form === "login") {
    e.preventDefault(); const fd = new FormData(f), btn = $("button[type=submit]", f); btn.disabled = true;
    const {error} = await supa.auth.signInWithPassword({email:String(fd.get("email")).trim(), password:String(fd.get("password"))});
    btn.disabled = false;
    if (error) { gateMsg = "E-mail ou mot de passe incorrect."; const el = $("#loginErr"); if (el) el.textContent = gateMsg; return; }
    location.reload(); return;
  }
  if (f.dataset.form !== "settings") return; e.preventDefault();
  const fd = new FormData(f), d = {target:num(fd.get("target")) || 30, vatOnsite:num(fd.get("vatOnsite")), vatTakeaway:num(fd.get("vatTakeaway")), openDays:num(fd.get("openDays")) || 26};
  if (await save(Store.set("settings", "main", d), "Réglages enregistrés")) log("Réglages modifiés", `Food cost visé ${d.target} %, TVA ${d.vatOnsite} % / ${d.vatTakeaway} %, ${d.openDays} jours d'ouverture`);
});

/* ============ Démarrage ============ */
let onboarded = false;
function checkOnboarding(){
  const m = IX.team[me.key];
  if (m) { me.label = m.label || ""; me.role = m.role || null; onboarded = true; if (modalLocked && modal.open) closeModal(); return; }
  if (!onboarded && !modal.open) openProfile(true);
}
async function boot(){
  try { const th = localStorage.getItem("tf-theme"); if (th && th !== "auto") document.documentElement.dataset.theme = th; } catch(e){}
  renderNav();
  await Store.init();
  if (Store.mode === "supa") {
    const {data:{session}} = await supa.auth.getSession();
    if (!session) { gate = "login"; render(); return; }
    me.id = session.user.id; me.name = session.user.email || "";
    const r = await supa.rpc("is_member");
    if (r.error || r.data !== true) { gate = "denied"; render(); return; }
    canWrite = true;
    supa.auth.onAuthStateChange((ev, s) => { if (ev === "SIGNED_OUT" || !s) location.reload(); });
  }
  me.key = safeSeg(me.id || "local");
  Store.watch("settings", d => { const m = d.find(x => x.id === "main"); S.settings = Object.assign({}, DEFAULT_SETTINGS, m || {}); delete S.settings.id; S.ready.add("settings"); schedule(); });
  Store.watch("team", d => { setS("team", "team", d, byName); checkOnboarding(); });
  Store.watch("ingredients", d => setS("ingredients", "ing", d, byName));
  Store.watch("recipes", d => setS("recipes", "rec", d, byName));
  Store.watch("charges", d => setS("charges", "charge", d, byName));
  Store.watch("sales", d => setS("sales", "sale", d));
  Store.watch("tasks", d => { setS("tasks", "task", d); carryOver(); }, {field:"date", op:">=", value:addDays(today, -120)});
  subscribeJournal();
  setInterval(() => { const t = todayStr(); if (t !== today) { if (UI.taskDate === today) UI.taskDate = t; today = t; carryOver(); subscribeJournal(); schedule(); } }, 60000);
}
boot();
</script>
</body>
